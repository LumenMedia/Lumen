name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x64:
    name: Build x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore Lumen.csproj -r win-x64

      - name: Build
        shell: pwsh
        run: dotnet build Lumen.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true --no-restore

      - name: Publish
        shell: pwsh
        run: dotnet publish Lumen.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true --no-restore -o artifacts/Lumen-win-x64

      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path artifacts/Lumen-win-x64/* -DestinationPath artifacts/Lumen-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Lumen-win-x64
          path: artifacts/Lumen-win-x64.zip
          if-no-files-found: error
          retention-days: 14
